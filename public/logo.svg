  <path d="M200 180 C210 195 230 210 250 220" stroke="white" stroke-width="0" fill="none"/>
  <path d="M250 220 C270 210 295 200 300 180" stroke="white" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Lower leaf pair -->
